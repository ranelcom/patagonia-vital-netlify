<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supabase Table Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --border: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #3ecf8e;
        --accent-ink: #052e1a;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--border);
      }
      header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
      header p  { margin: 0; color: var(--muted); font-size: 13px; }
      main { padding: 24px 32px; max-width: 1100px; }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .panel {
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .panel p {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .controls label { color: var(--muted); font-size: 13px; }
      select, input, button {
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
      }
      input { width: 220px; }
      button {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: progress; }
      .ghost {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .toolbar p {
        margin: 0;
        color: var(--muted);
      }
      #status {
        min-height: 20px;
        margin: 12px 0;
        color: var(--muted);
        font-size: 13px;
      }
      #auth-status {
        min-height: 20px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
      }
      #auth-status.error { color: var(--danger); }
      #status.error { color: var(--danger); }
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        vertical-align: top;
      }
      th {
        background: var(--panel);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        position: sticky;
        top: 0;
      }
      tr:last-child td { border-bottom: none; }
      td pre {
        margin: 0;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-width: 480px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Supabase Table Viewer</h1>
      <p>Log in first, then load one of the predefined tables through the Netlify Function.</p>
    </header>
    <main>
      <div class="stack">
        <section id="auth-panel" class="panel" hidden>
          <h2>Login</h2>
          <p>Use the credentials configured in Netlify environment variables.</p>
          <form class="controls" id="login-form">
            <label for="username">User</label>
            <input id="username" name="username" autocomplete="username" />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <button type="submit" id="login-btn">Login</button>
          </form>
          <div id="auth-status"></div>
        </section>

        <section id="app-panel" hidden>
          <div class="toolbar">
            <p>Authenticated session active.</p>
            <button type="button" id="logout" class="ghost">Logout</button>
          </div>
          <form class="controls" id="form">
            <label for="preset">Table</label>
            <select id="preset">
              <!-- Edit this list to match the tables in your Supabase project. -->
              <option value="users">users</option>
              <option value="posts">posts</option>
              <option value="comments">comments</option>
            </select>
            <label for="limit">Limit</label>
            <input id="limit" type="number" min="1" max="500" value="50" style="width: 80px" />
            <button type="submit" id="load">Load</button>
          </form>
          <div id="status"></div>
          <div id="output" class="table-wrap" hidden></div>
        </section>
      </div>
    </main>

    <script type="module">
      const authPanel = document.getElementById('auth-panel')
      const appPanel = document.getElementById('app-panel')
      const loginForm = document.getElementById('login-form')
      const usernameInput = document.getElementById('username')
      const passwordInput = document.getElementById('password')
      const loginBtn = document.getElementById('login-btn')
      const authStatus = document.getElementById('auth-status')
      const form = document.getElementById('form')
      const preset = document.getElementById('preset')
      const limitInput = document.getElementById('limit')
      const loadBtn = document.getElementById('load')
      const logoutBtn = document.getElementById('logout')
      const status = document.getElementById('status')
      const output = document.getElementById('output')

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const username = usernameInput.value.trim()
        const password = passwordInput.value

        if (!username || !password) {
          setAuthStatus('Enter your username and password.', true)
          return
        }

        loginBtn.disabled = true
        setAuthStatus('Signing in…')

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username, password }),
          })
          const body = await res.json()
          if (!res.ok) {
            throw new Error(body?.error || body?.message || `HTTP ${res.status}`)
          }

          passwordInput.value = ''
          setAuthenticated(true)
          setAuthStatus('')
          setStatus('Signed in. Select a table to load data.')
        } catch (err) {
          setAuthStatus(err.message || String(err), true)
        } finally {
          loginBtn.disabled = false
        }
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const table = preset.value
        if (!table) {
          setStatus('Select a table.', true)
          return
        }
        const limit = Math.max(1, Math.min(500, Number(limitInput.value) || 50))

        loadBtn.disabled = true
        setStatus('Loading…')
        output.hidden = true
        output.innerHTML = ''

        try {
          const res = await fetch(
            `/api/supabase?table=${encodeURIComponent(table)}&limit=${limit}`,
          )
          const body = await res.json()
          if (res.status === 401) {
            setAuthenticated(false)
            throw new Error(body?.error || 'Your session expired. Please log in again.')
          }
          if (!res.ok) {
            throw new Error(body?.error || body?.message || `HTTP ${res.status}`)
          }
          renderRows(body, table)
          setStatus(`Loaded ${Array.isArray(body) ? body.length : 0} row(s) from "${table}".`)
        } catch (err) {
          setStatus(err.message || String(err), true)
        } finally {
          loadBtn.disabled = false
        }
      })

      logoutBtn.addEventListener('click', async () => {
        logoutBtn.disabled = true
        try {
          await fetch('/api/logout', { method: 'POST' })
        } finally {
          logoutBtn.disabled = false
          setAuthenticated(false)
          setStatus('')
          output.hidden = true
          output.innerHTML = ''
        }
      })

      await refreshAuthState()

      async function refreshAuthState() {
        try {
          const res = await fetch('/api/auth-status')
          const body = await res.json()
          setAuthenticated(Boolean(body?.authenticated))
          if (!res.ok && body?.error) {
            setAuthStatus(body.error, true)
          }
        } catch (err) {
          setAuthenticated(false)
          setAuthStatus(err.message || String(err), true)
        }
      }

      function setAuthenticated(authenticated) {
        authPanel.hidden = authenticated
        appPanel.hidden = !authenticated
        if (!authenticated) {
          usernameInput.focus()
        }
      }

      function setAuthStatus(msg, isError = false) {
        authStatus.textContent = msg
        authStatus.classList.toggle('error', isError)
      }

      function setStatus(msg, isError = false) {
        status.textContent = msg
        status.classList.toggle('error', isError)
      }

      function renderRows(rows, table) {
        output.hidden = false
        if (!Array.isArray(rows) || rows.length === 0) {
          output.innerHTML = `<div class="empty">No rows in "${escapeHtml(table)}".</div>`
          return
        }
        const columns = Array.from(
          rows.reduce((set, row) => {
            Object.keys(row ?? {}).forEach((k) => set.add(k))
            return set
          }, new Set()),
        )
        const thead =
          '<thead><tr>' +
          columns.map((c) => `<th>${escapeHtml(c)}</th>`).join('') +
          '</tr></thead>'
        const tbody =
          '<tbody>' +
          rows
            .map(
              (row) =>
                '<tr>' +
                columns
                  .map((c) => `<td>${formatCell(row?.[c])}</td>`)
                  .join('') +
                '</tr>',
            )
            .join('') +
          '</tbody>'
        output.innerHTML = `<table>${thead}${tbody}</table>`
      }

      function formatCell(value) {
        if (value === null || value === undefined) {
          return '<span style="color:var(--muted)">—</span>'
        }
        if (typeof value === 'object') {
          return `<pre>${escapeHtml(JSON.stringify(value, null, 2))}</pre>`
        }
        return escapeHtml(String(value))
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;')
      }
    </script>
  </body>
</html>
